<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="CSS/Styles.css">
</head>
<body>

    <header>
        <h1 class="Encabezado">Andrea Porras Valadez <span>Freelancer</span></h1>
    </header>

    <div class="Nav-bg">
        <nav class="Contenedor Navegacion">
            <a href="Index.html">Inicio</a>
            <a href="SobreMi.html">Sobre Mi</a>
            <a href="Horario.html">Horario</a>
            <a href="Contacto.html">Contacto</a>
        </nav>
    </div>

    <main class="Pagina">
        <h2 class="h2">Contacto</h2>

        <form class="Formulario">
            <fieldset>
                <legend>Contáctame llenando con tu información</legend>

                <div class="Contenedor-campos">
                    <div class="Campo">
                        <label>Nombre:</label>
                        <input class="input-text" type="text" placeholder="Tu nombre">
                    </div>

                    <div class="Campo">
                        <label>Teléfono:</label>
                        <input class="input-text" type="tel" placeholder="Tu teléfono">
                    </div>

                    <div class="Campo">
                        <label>Correo Electrónico:</label>
                        <input class="input-text" type="email" placeholder="Tu correo">
                    </div>

                    <div class="Campo">
                        <label>Mensaje:</label>
                        <textarea class="input-text" placeholder="Escribe tu mensaje"></textarea>
                    </div>
                </div>

                <input class="boton" type="submit" value="Enviar">
            </fieldset>
        </form>
    </main>

    <footer class="pie-de-pagina">
        <p>Andrea Porras Valadez - Freelancer</p>
    </footer>

</body>
</html>
